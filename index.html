<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>LiveAvatar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Contenitore a tutto schermo */
    .page {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background:
        radial-gradient(circle at center, #1c2638 0%, #080b10 65%, #000 100%);
    }

    /* Area verticale 9:16 */
    .avatar-container {
      position: relative;
      height: 100vh;
      height: 100dvh;
      max-width: 100vw;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
    }

    .avatar-container iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    /* Schermata iniziale sopra l'avatar */
    .start-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      transition:
        opacity 0.4s ease,
        visibility 0.4s ease;
    }

    .start-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Pulsante grande al centro */
    .start-button {
      min-width: min(82%, 430px);
      min-height: 110px;
      padding: 24px 35px;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 60px;
      background: linear-gradient(135deg, #1769ff, #00b7ff);
      color: #fff;
      font-size: clamp(24px, 3vw, 38px);
      font-weight: 700;
      line-height: 1.15;
      text-align: center;
      cursor: pointer;
      box-shadow:
        0 15px 45px rgba(0, 132, 255, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .start-button:hover {
      transform: scale(1.05);
      box-shadow:
        0 18px 60px rgba(0, 132, 255, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .start-button:active {
      transform: scale(0.98);
    }

    .start-button:focus-visible {
      outline: 5px solid #fff;
      outline-offset: 6px;
    }

    .start-button span {
      display: block;
      margin-bottom: 7px;
      font-size: 1.25em;
    }

    .start-button small {
      display: block;
      font-size: 0.48em;
      font-weight: 400;
      opacity: 0.9;
    }

    /* Adattamento per monitor verticali o stretti */
    @media (max-aspect-ratio: 9/16) {
      .avatar-container {
        width: 100vw;
        height: auto;
        max-height: 100vh;
        max-height: 100dvh;
      }
    }
  </style>
</head>

<body>
  <main class="page" id="page">

    <section class="avatar-container">
      <iframe
        id="liveAvatar"
        src="https://embed.liveavatar.com/v1/3a0645eb-a537-44ec-afc2-de5247a06a6d?orientation=vertical"
        allow="microphone; autoplay"
        title="LiveAvatar Embed"
        loading="eager"
      ></iframe>

      <div class="start-overlay" id="startOverlay">
        <button class="start-button" id="startButton" type="button">
          <span>🎙 Avvia conversazione</span>
          <small>Tocca per entrare a schermo intero</small>
        </button>
      </div>
    </section>

  </main>

  <script>
    const startButton = document.getElementById("startButton");
    const startOverlay = document.getElementById("startOverlay");
    const liveAvatar = document.getElementById("liveAvatar");

    startButton.addEventListener("click", async () => {
      /*
       * La modalità schermo intero può essere avviata solamente
       * dopo un'azione diretta dell'utente, come questo clic.
       */
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.log("Modalità schermo intero non disponibile:", error);
      }

      startOverlay.classList.add("hidden");

      /* Porta l'attenzione sull'area LiveAvatar */
      liveAvatar.focus();
    });
  </script>
</body>
</html>
