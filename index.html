<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>LiveAvatar italiano</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080d15;
    }

    body {
      display: grid;
      place-items: center;
    }

    .page {
      display: grid;
      place-items: center;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background:
        radial-gradient(
          circle at 50% 45%,
          #243247 0,
          #101722 48%,
          #080d15 100%
        );
    }

    /* Cornice verticale 9:16 */
    .avatar-frame {
      position: relative;
      width: min(100vw, calc(100dvh * 9 / 16));
      height: min(100dvh, calc(100vw * 16 / 9));
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 70px rgba(0, 0, 0, 0.72);
      isolation: isolate;
    }

    .avatar-preview,
    .avatar-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-preview {
      z-index: 0;
    }

    .avatar-video {
      z-index: 1;
      opacity: 0;
      background: #000;
      transition: opacity 300ms ease;
    }

    .avatar-video.visible {
      opacity: 1;
    }

    /* Schermata iniziale */
    .start-overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(0, 0, 0, 0.30);
      backdrop-filter: blur(4px);
      transition:
        opacity 300ms ease,
        visibility 300ms ease;
    }

    .start-overlay.hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    /* Pulsante centrale */
    .start-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: min(100%, 420px);
      min-height: 138px;
      margin: 0;
      padding: 20px 18px 18px;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 62px;
      background: linear-gradient(
        135deg,
        #2174ff 0%,
        #08b8ef 100%
      );
      color: #fff;
      text-align: center;
      cursor: pointer;
      box-shadow:
        0 18px 46px rgba(0, 132, 255, 0.48),
        inset 0 1px 0 rgba(255, 255, 255, 0.32);
      transition:
        transform 180ms ease,
        filter 180ms ease;
    }

    .start-button:hover:not(:disabled) {
      transform: scale(1.035);
      filter: brightness(1.06);
    }

    .start-button:active:not(:disabled) {
      transform: scale(0.985);
    }

    .start-button:focus-visible {
      outline: 5px solid #fff;
      outline-offset: 6px;
    }

    .start-button:disabled {
      cursor: wait;
      opacity: 0.86;
    }

    /* Prima riga del pulsante */
    .button-first-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      font-size: clamp(30px, 8.4vw, 45px);
      font-weight: 800;
      line-height: 1;
    }

    .button-first-line svg {
      flex: 0 0 auto;
      width: 0.78em;
      height: 0.78em;
    }

    /* Seconda riga del pulsante */
    .button-second-line {
      display: block;
      width: 100%;
      max-width: 100%;
      font-size: clamp(28px, 8.1vw, 43px);
      font-weight: 800;
      line-height: 1.05;
      text-align: center;
      overflow-wrap: normal;
      word-break: normal;
    }

    .button-help {
      display: block;
      width: 100%;
      margin-top: 8px;
      font-size: clamp(14px, 3.6vw, 19px);
      font-weight: 400;
      line-height: 1.2;
      text-align: center;
      opacity: 0.95;
    }

    /* Messaggi di stato */
    .status {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      z-index: 4;
      max-width: calc(100% - 30px);
      padding: 9px 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font-size: clamp(13px, 3vw, 16px);
      text-align: center;
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity 200ms ease;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .status.visible {
      opacity: 1;
    }

    @media (max-width: 420px) {
      .start-overlay {
        padding: 18px;
      }

      .start-button {
        min-height: 124px;
        padding-inline: 14px;
        border-radius: 52px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section
      class="avatar-frame"
      aria-label="Conversazione con LiveAvatar"
    >
      <!-- Anteprima visualizzata prima della connessione -->
      <img
        class="avatar-preview"
        src="https://static.liveavatar.com/avatars/thumbnails/fb40cdb567ef4c189038490829c20e6f/thumbnail_263f26b7489e4591a55800ca504ffccb.png"
        alt="Anteprima dell'avatar"
      >

      <!-- Qui viene visualizzato l'avatar in diretta -->
      <video
        id="avatarVideo"
        class="avatar-video"
        autoplay
        playsinline
      ></video>

      <div
        id="status"
        class="status"
        role="status"
        aria-live="polite"
      ></div>

      <div id="startOverlay" class="start-overlay">
        <button
          id="startButton"
          class="start-button"
          type="button"
          aria-label="Avvia la conversazione in italiano"
        >
          <span class="button-first-line">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.92V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.08A7 7 0 0 1 5 12a1 1 0 1 1 2 0 5 5 0 0 0 10 0Z"
              />
            </svg>

            <span>Avvia</span>
          </span>

          <span class="button-second-line">
            conversazione
          </span>

          <span id="buttonHelp" class="button-help">
            Tocca una sola volta
          </span>
        </button>
      </div>
    </section>
  </main>

  <script type="module">
    import {
      AgentEventsEnum,
      LiveAvatarSession,
      SessionEvent
    } from "https://cdn.jsdelivr.net/npm/@heygen/liveavatar-web-sdk@0.0.20/+esm";

    /*
     * ID del tuo embed LiveAvatar.
     */
    const EMBED_ID =
      "3a0645eb-a537-44ec-afc2-de5247a06a6d";

    /*
     * Lingua della conversazione.
     */
    const LANGUAGE = "it";

    /*
     * Saluto pronunciato automaticamente se l'avatar
     * non possiede già un messaggio iniziale.
     */
    const INITIAL_GREETING =
      "Ciao! Sono pronto ad ascoltarti. Come posso aiutarti?";

    const startButton =
      document.getElementById("startButton");

    const buttonHelp =
      document.getElementById("buttonHelp");

    const startOverlay =
      document.getElementById("startOverlay");

    const avatarVideo =
      document.getElementById("avatarVideo");

    const status =
      document.getElementById("status");

    let session = null;
    let starting = false;
    let avatarHasAlreadySpoken = false;

    function showStatus(message) {
      status.textContent = message;
      status.classList.add("visible");
    }

    function hideStatusAfter(delay = 2200) {
      window.setTimeout(() => {
        status.classList.remove("visible");
      }, delay);
    }

    /*
     * Attiva la modalità a schermo intero.
     */
    async function requestFullscreen() {
      if (
        !document.fullscreenElement &&
        document.documentElement.requestFullscreen
      ) {
        try {
          await document.documentElement.requestFullscreen();
        } catch {
          /*
           * La conversazione funziona anche se il browser
           * non permette la modalità a schermo intero.
           */
        }
      }
    }

    /*
     * Richiede l'autorizzazione per utilizzare il microfono.
     */
    async function requestMicrophonePermission() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error(
          "Questo browser non supporta l'accesso al microfono."
        );
      }

      const permissionStream =
        await navigator.mediaDevices.getUserMedia({
          audio: true
        });

      /*
       * L'SDK aprirà subito dopo il flusso audio definitivo.
       */
      permissionStream
        .getTracks()
        .forEach((track) => track.stop());
    }

    /*
     * Ottiene il token utilizzando lo stesso ID dell'embed.
     */
    async function getEmbedSessionToken() {
      const response = await fetch(
        "https://api.liveavatar.com/v1/sessions/embed/token",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            embed_id: EMBED_ID,
            language: LANGUAGE
          })
        }
      );

      const result = await response.json();

      if (
        !response.ok ||
        result.code !== 1000 ||
        !result.data?.session_token
      ) {
        throw new Error(
          result.message ||
          "Impossibile avviare LiveAvatar."
        );
      }

      return result.data.session_token;
    }

    /*
     * Avvia la conversazione con un solo clic.
     */
    async function startConversation() {
      if (starting) {
        return;
      }

      starting = true;
      avatarHasAlreadySpoken = false;

      startButton.disabled = true;
      buttonHelp.textContent = "Connessione in corso…";

      showStatus("Autorizzazione del microfono…");

      /*
       * Schermo intero e microfono vengono attivati
       * dallo stesso clic dell'utente.
       */
      const fullscreenPromise = requestFullscreen();

      try {
        await requestMicrophonePermission();
        await fullscreenPromise;

        showStatus("Connessione all'avatar…");

        const token = await getEmbedSessionToken();

        session = new LiveAvatarSession(token, {
          autoKeepAlive: true,
          voiceChat: {}
        });

        /*
         * Collega il flusso video e audio all'elemento video.
         */
        session.on(
          SessionEvent.SESSION_STREAM_READY,
          () => {
            session.attach(avatarVideo);

            avatarVideo.classList.add("visible");

            avatarVideo
              .play()
              .catch(() => {});
          }
        );

        /*
         * Segnala quando l'avatar sta parlando.
         */
        session.on(
          AgentEventsEnum.AVATAR_SPEAK_STARTED,
          () => {
            avatarHasAlreadySpoken = true;
            showStatus("L'avatar sta parlando");
          }
        );

        /*
         * Segnala quando l'avatar ha terminato.
         */
        session.on(
          AgentEventsEnum.AVATAR_SPEAK_ENDED,
          () => {
            showStatus("Ti ascolto…");
            hideStatusAfter();
          }
        );

        /*
         * Segnala quando l'utente sta parlando.
         */
        session.on(
          AgentEventsEnum.USER_SPEAK_STARTED,
          () => {
            showStatus("Ti ascolto…");
          }
        );

        /*
         * Ripristina il pulsante quando la sessione termina.
         */
        session.on(
          SessionEvent.SESSION_DISCONNECTED,
          () => {
            avatarVideo.classList.remove("visible");
            startOverlay.classList.remove("hidden");

            startButton.disabled = false;
            buttonHelp.textContent =
              "Tocca per riconnetterti";

            showStatus("Sessione terminata");

            starting = false;
          }
        );

        /*
         * Avvia effettivamente LiveAvatar.
         */
        await session.start();

        /*
         * Nasconde il pulsante iniziale.
         */
        startOverlay.classList.add("hidden");

        showStatus(
          "Conversazione attiva in italiano"
        );

        hideStatusAfter();

        /*
         * Se LiveAvatar non ha già pronunciato un saluto,
         * fa partire automaticamente questa frase.
         */
        window.setTimeout(() => {
          if (
            session &&
            !avatarHasAlreadySpoken
          ) {
            session.repeat(INITIAL_GREETING);
          }
        }, 2200);

      } catch (error) {
        console.error(error);

        startButton.disabled = false;

        buttonHelp.textContent =
          "Riprova e consenti il microfono";

        if (error?.name === "NotAllowedError") {
          showStatus(
            "Per conversare devi consentire l'uso del microfono."
          );
        } else {
          showStatus(
            error?.message ||
            "Errore durante l'avvio della conversazione."
          );
        }

        starting = false;
      }
    }

    /*
     * Unico pulsante necessario per avviare tutto.
     */
    startButton.addEventListener(
      "click",
      startConversation
    );

    /*
     * Chiude correttamente la sessione quando
     * la pagina viene chiusa.
     */
    window.addEventListener("pagehide", () => {
      if (session) {
        session.stop().catch(() => {});
      }
    });
  </script>
</body>
</html>
