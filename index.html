<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Avventure con il supereroe</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070b13;
    }

    body {
      display: grid;
      place-items: center;
    }

    /* Pagina a tutto schermo */
    .page {
      display: grid;
      place-items: center;
      width: 100vw;
      height: 100vh;
      height: 100dvh;

      background:
        radial-gradient(
          circle at 50% 42%,
          #263b5c 0%,
          #111a29 48%,
          #070b13 100%
        );
    }

    /* Area verticale 9:16 */
    .avatar-frame {
      position: relative;

      width: min(
        100vw,
        calc(100dvh * 9 / 16)
      );

      height: min(
        100dvh,
        calc(100vw * 16 / 9)
      );

      aspect-ratio: 9 / 16;
      overflow: hidden;

      background: #000;

      box-shadow:
        0 0 75px rgba(0, 0, 0, 0.78);

      isolation: isolate;
    }

    /* Immagine e video */
    .avatar-preview,
    .avatar-video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .avatar-preview {
      z-index: 0;
    }

    .avatar-video {
      z-index: 1;
      opacity: 0;
      background: #000;

      transition:
        opacity 350ms ease;
    }

    .avatar-video.visible {
      opacity: 1;
    }

    /* Messaggio superiore */
    .top-status {
      position: absolute;
      top: max(
        15px,
        env(safe-area-inset-top)
      );
      left: 50%;
      z-index: 8;

      width: max-content;
      max-width: calc(100% - 30px);

      padding: 10px 16px;

      border:
        1px solid
        rgba(255, 255, 255, 0.22);

      border-radius: 999px;

      background:
        rgba(0, 0, 0, 0.62);

      color: #fff;

      font-size:
        clamp(13px, 3.2vw, 17px);

      font-weight: 700;
      text-align: center;

      transform: translateX(-50%);

      backdrop-filter: blur(9px);
    }

    .top-status.active {
      border-color:
        rgba(64, 231, 151, 0.65);

      box-shadow:
        0 0 24px
        rgba(64, 231, 151, 0.25);
    }

    /* Schermata del conto alla rovescia */
    .cycle-overlay {
      position: absolute;
      inset: 0;
      z-index: 5;

      display: grid;
      place-items: center;

      padding: 26px;

      background:
        linear-gradient(
          180deg,
          rgba(2, 7, 17, 0.18),
          rgba(2, 7, 17, 0.58)
        );

      backdrop-filter: blur(3px);

      transition:
        opacity 300ms ease,
        visibility 300ms ease;
    }

    .cycle-overlay.hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    /* Cornice del timer */
    .countdown-card {
      width: min(100%, 390px);

      padding: 26px 20px 24px;

      border:
        3px solid
        rgba(255, 255, 255, 0.88);

      border-radius: 46px;

      background:
        linear-gradient(
          145deg,
          rgba(31, 111, 255, 0.95),
          rgba(7, 184, 237, 0.95)
        );

      color: #fff;
      text-align: center;

      box-shadow:
        0 22px 55px
        rgba(0, 119, 255, 0.42),
        inset 0 1px 0
        rgba(255, 255, 255, 0.30);
    }

    .countdown-eyebrow {
      margin: 0 0 10px;

      font-size:
        clamp(13px, 3vw, 17px);

      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .countdown-title {
      margin: 0;

      font-size:
        clamp(28px, 7vw, 39px);

      font-weight: 900;
      line-height: 1.04;
    }

    .countdown-clock {
      margin: 13px 0 8px;

      font-family:
        "Arial Black",
        Arial,
        Helvetica,
        sans-serif;

      font-size:
        clamp(60px, 16vw, 88px);

      font-weight: 900;
      line-height: 0.96;
      letter-spacing: -0.055em;

      text-shadow:
        0 5px 18px
        rgba(0, 0, 0, 0.22);

      font-variant-numeric:
        tabular-nums;
    }

    .countdown-help {
      margin: 0;

      font-size:
        clamp(15px, 3.7vw, 19px);

      line-height: 1.3;
    }

    /* Schermata per l'eventuale autorizzazione iniziale */
    .permission-overlay {
      position: absolute;
      inset: 0;
      z-index: 12;

      display: grid;
      place-items: center;

      padding: 26px;

      background:
        rgba(3, 8, 17, 0.72);

      backdrop-filter: blur(7px);
    }

    .permission-overlay.hidden {
      display: none;
    }

    .permission-card {
      width: min(100%, 390px);

      padding: 25px 22px;

      border:
        2px solid
        rgba(255, 255, 255, 0.82);

      border-radius: 36px;

      background:
        rgba(12, 24, 43, 0.95);

      color: #fff;
      text-align: center;

      box-shadow:
        0 22px 60px
        rgba(0, 0, 0, 0.50);
    }

    .permission-card h2 {
      margin: 0 0 10px;

      font-size:
        clamp(24px, 6vw, 34px);
    }

    .permission-card p {
      margin: 0 0 20px;

      color:
        rgba(255, 255, 255, 0.82);

      font-size:
        clamp(15px, 3.5vw, 18px);

      line-height: 1.35;
    }

    .permission-button {
      width: 100%;
      min-height: 74px;

      padding: 14px 18px;

      border: 2px solid #fff;
      border-radius: 999px;

      background:
        linear-gradient(
          135deg,
          #2174ff,
          #08b8ef
        );

      color: #fff;

      font-size:
        clamp(19px, 4.5vw, 25px);

      font-weight: 800;
      cursor: pointer;
    }

    .permission-button:disabled {
      cursor: wait;
      opacity: 0.70;
    }

    @media (max-width: 420px) {
      .cycle-overlay,
      .permission-overlay {
        padding: 20px;
      }

      .countdown-card {
        padding-inline: 15px;
        border-radius: 38px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section
      class="avatar-frame"
      aria-label="Avventura con il supereroe"
    >
      <!-- Immagine visualizzata durante la pausa -->
      <img
        class="avatar-preview"
        src="https://static.liveavatar.com/avatars/thumbnails/fb40cdb567ef4c189038490829c20e6f/thumbnail_263f26b7489e4591a55800ca504ffccb.png"
        alt="Anteprima del supereroe"
      >

      <!-- Video LiveAvatar -->
      <video
        id="avatarVideo"
        class="avatar-video"
        autoplay
        playsinline
      ></video>

      <!-- Stato superiore -->
      <div
        id="topStatus"
        class="top-status"
        role="status"
        aria-live="polite"
      >
        Preparazione dell'avventura…
      </div>

      <!-- Conto alla rovescia -->
      <div
        id="cycleOverlay"
        class="cycle-overlay"
      >
        <div class="countdown-card">
          <p
            id="countdownEyebrow"
            class="countdown-eyebrow"
          >
            Il supereroe sta arrivando
          </p>

          <h1
            id="countdownTitle"
            class="countdown-title"
          >
            Prossima avventura tra
          </h1>

          <div
            id="countdownClock"
            class="countdown-clock"
          >
            00:00
          </div>

          <p
            id="countdownHelp"
            class="countdown-help"
          >
            Preparati a parlare con il tuo supereroe!
          </p>
        </div>
      </div>

      <!-- Autorizzazione iniziale -->
      <div
        id="permissionOverlay"
        class="permission-overlay hidden"
      >
        <div class="permission-card">
          <h2>
            Attiva l'esperienza
          </h2>

          <p id="permissionMessage">
            Il browser richiede una sola autorizzazione
            iniziale per microfono e audio.
          </p>

          <button
            id="permissionButton"
            class="permission-button"
            type="button"
          >
            Abilita e avvia
          </button>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import {
      AgentEventsEnum,
      LiveAvatarSession,
      SessionEvent
    } from "https://cdn.jsdelivr.net/npm/@heygen/liveavatar-web-sdk@0.0.20/+esm";

    /*
     * ID del tuo embed LiveAvatar.
     */
    const EMBED_ID =
      "3a0645eb-a537-44ec-afc2-de5247a06a6d";

    /*
     * Lingua italiana.
     */
    const LANGUAGE = "it";

    /*
     * Durata della conversazione:
     * 3 minuti.
     */
    const SESSION_DURATION_MS =
      3 * 60 * 1000;

    /*
     * Durata della pausa:
     * 5 minuti.
     */
    const PAUSE_DURATION_MS =
      5 * 60 * 1000;

    /*
     * Saluto automatico del supereroe.
     */
    const INITIAL_GREETING =
      "Ciao! La nostra avventura comincia adesso. Come posso aiutarti?";

    const avatarVideo =
      document.getElementById(
        "avatarVideo"
      );

    const topStatus =
      document.getElementById(
        "topStatus"
      );

    const cycleOverlay =
      document.getElementById(
        "cycleOverlay"
      );

    const countdownEyebrow =
      document.getElementById(
        "countdownEyebrow"
      );

    const countdownTitle =
      document.getElementById(
        "countdownTitle"
      );

    const countdownClock =
      document.getElementById(
        "countdownClock"
      );

    const countdownHelp =
      document.getElementById(
        "countdownHelp"
      );

    const permissionOverlay =
      document.getElementById(
        "permissionOverlay"
      );

    const permissionMessage =
      document.getElementById(
        "permissionMessage"
      );

    const permissionButton =
      document.getElementById(
        "permissionButton"
      );

    let currentSession = null;

    let cycleState = "starting";

    let microphoneAuthorized = false;

    let avatarHasSpoken = false;

    let pageIsClosing = false;

    let sessionStopTimer = null;

    let sessionCountdownTimer = null;

    let pauseStartTimer = null;

    let pauseCountdownTimer = null;

    /*
     * Cancella un timer.
     */
    function clearTimer(timer) {
      if (timer) {
        window.clearTimeout(timer);
      }

      return null;
    }

    /*
     * Cancella un intervallo.
     */
    function clearIntervalTimer(timer) {
      if (timer) {
        window.clearInterval(timer);
      }

      return null;
    }

    /*
     * Cancella i timer della sessione.
     */
    function clearSessionTimers() {
      sessionStopTimer =
        clearTimer(
          sessionStopTimer
        );

      sessionCountdownTimer =
        clearIntervalTimer(
          sessionCountdownTimer
        );
    }

    /*
     * Cancella i timer della pausa.
     */
    function clearPauseTimers() {
      pauseStartTimer =
        clearTimer(
          pauseStartTimer
        );

      pauseCountdownTimer =
        clearIntervalTimer(
          pauseCountdownTimer
        );
    }

    /*
     * Converte i millisecondi in minuti e secondi.
     */
    function formatTime(milliseconds) {
      const seconds =
        Math.max(
          0,
          Math.ceil(
            milliseconds / 1000
          )
        );

      const minutesPart =
        Math.floor(
          seconds / 60
        )
          .toString()
          .padStart(2, "0");

      const secondsPart =
        (
          seconds % 60
        )
          .toString()
          .padStart(2, "0");

      return (
        minutesPart +
        ":" +
        secondsPart
      );
    }

    /*
     * Aggiorna il messaggio superiore.
     */
    function setStatus(
      message,
      active = false
    ) {
      topStatus.textContent =
        message;

      topStatus.classList.toggle(
        "active",
        active
      );
    }

    /*
     * Mostra il pulsante per l'autorizzazione
     * se il browser blocca microfono o audio.
     */
    function showPermissionFallback(
      message,
      buttonText = "Abilita e avvia"
    ) {
      permissionMessage.textContent =
        message;

      permissionButton.textContent =
        buttonText;

      permissionOverlay.classList.remove(
        "hidden"
      );
    }

    /*
     * Nasconde la richiesta di autorizzazione.
     */
    function hidePermissionFallback() {
      permissionOverlay.classList.add(
        "hidden"
      );
    }

    /*
     * Richiede l'autorizzazione del microfono.
     */
    async function authorizeMicrophone() {
      if (
        !navigator.mediaDevices
          ?.getUserMedia
      ) {
        throw new Error(
          "Apri questa pagina tramite HTTPS o localhost per usare il microfono."
        );
      }

      const stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });

      stream
        .getTracks()
        .forEach((track) => {
          track.stop();
        });

      microphoneAuthorized = true;
    }

    /*
     * Ottiene il token della sessione LiveAvatar.
     */
    async function getEmbedSessionToken() {
      const response =
        await fetch(
          "https://api.liveavatar.com/v1/sessions/embed/token",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              embed_id: EMBED_ID,
              language: LANGUAGE
            })
          }
        );

      const result =
        await response.json();

      if (
        !response.ok ||
        result.code !== 1000 ||
        !result.data?.session_token
      ) {
        throw new Error(
          result.message ||
          "Impossibile creare la sessione LiveAvatar."
        );
      }

      return result.data.session_token;
    }

    /*
     * Avvia il conto alla rovescia
     * dei tre minuti di conversazione.
     */
    function beginActiveCountdown() {
      const sessionEndsAt =
        Date.now() +
        SESSION_DURATION_MS;

      const update = () => {
        const remaining =
          sessionEndsAt -
          Date.now();

        setStatus(
          "Avventura in corso · " +
          formatTime(remaining),
          true
        );
      };

      update();

      sessionCountdownTimer =
        window.setInterval(
          update,
          250
        );

      /*
       * Dopo tre minuti chiude LiveAvatar.
       */
      sessionStopTimer =
        window.setTimeout(
          async () => {
            setStatus(
              "Tre minuti trascorsi · fine dell'avventura"
            );

            if (currentSession) {
              try {
                await currentSession.stop();
              } catch (error) {
                console.error(
                  "Errore durante la chiusura:",
                  error
                );

                enterPause();
              }
            } else {
              enterPause();
            }
          },
          SESSION_DURATION_MS
        );
    }

    /*
     * Avvia la pausa di cinque minuti.
     */
    function enterPause() {
      if (
        pageIsClosing ||
        cycleState === "pause"
      ) {
        return;
      }

      cycleState = "pause";

      clearSessionTimers();
      clearPauseTimers();

      currentSession = null;

      avatarVideo.classList.remove(
        "visible"
      );

      cycleOverlay.classList.remove(
        "hidden"
      );

      countdownEyebrow.textContent =
        "Il supereroe tornerà";

      countdownTitle.textContent =
        "Prossima avventura tra";

      countdownHelp.textContent =
        "Preparati: la prossima conversazione partirà automaticamente.";

      const pauseEndsAt =
        Date.now() +
        PAUSE_DURATION_MS;

      const update = () => {
        const remaining =
          pauseEndsAt -
          Date.now();

        const formatted =
          formatTime(remaining);

        countdownClock.textContent =
          formatted;

        setStatus(
          "Pausa · prossima avventura tra " +
          formatted
        );
      };

      update();

      pauseCountdownTimer =
        window.setInterval(
          update,
          250
        );

      /*
       * Dopo cinque minuti parte
       * automaticamente una nuova sessione.
       */
      pauseStartTimer =
        window.setTimeout(
          () => {
            clearPauseTimers();
            startAutomaticSession();
          },
          PAUSE_DURATION_MS
        );
    }

    /*
     * Avvia automaticamente LiveAvatar.
     */
    async function startAutomaticSession() {
      if (
        pageIsClosing ||
        cycleState === "connecting" ||
        cycleState === "active"
      ) {
        return;
      }

      cycleState = "connecting";

      clearPauseTimers();
      clearSessionTimers();

      avatarHasSpoken = false;

      cycleOverlay.classList.remove(
        "hidden"
      );

      countdownEyebrow.textContent =
        "Il supereroe sta arrivando";

      countdownTitle.textContent =
        "Connessione in corso";

      countdownClock.textContent =
        "00:00";

      countdownHelp.textContent =
        "Tra pochi istanti inizierà una nuova avventura.";

      setStatus(
        "Connessione al supereroe…"
      );

      try {
        /*
         * Richiede il microfono solo se non
         * è già stato autorizzato.
         */
        if (!microphoneAuthorized) {
          await authorizeMicrophone();
        }

        const token =
          await getEmbedSessionToken();

        const sessionForThisCycle =
          new LiveAvatarSession(
            token,
            {
              autoKeepAlive: true,
              voiceChat: {}
            }
          );

        currentSession =
          sessionForThisCycle;

        /*
         * Collega il flusso video e audio.
         */
        sessionForThisCycle.on(
          SessionEvent
            .SESSION_STREAM_READY,
          () => {
            if (
              currentSession !==
              sessionForThisCycle
            ) {
              return;
            }

            sessionForThisCycle.attach(
              avatarVideo
            );

            avatarVideo.classList.add(
              "visible"
            );

            /*
             * Prova a riprodurre l'audio
             * automaticamente.
             */
            avatarVideo
              .play()
              .catch((error) => {
                console.error(
                  "Audio automatico bloccato:",
                  error
                );

                showPermissionFallback(
                  "Il browser ha bloccato l'audio automatico. Tocca una sola volta per abilitarlo; i cicli successivi saranno automatici.",
                  "Attiva l'audio"
                );
              });
          }
        );

        /*
         * Controlla se l'avatar
         * ha già pronunciato un saluto.
         */
        sessionForThisCycle.on(
          AgentEventsEnum
            .AVATAR_SPEAK_STARTED,
          () => {
            avatarHasSpoken = true;
          }
        );

        /*
         * Quando la sessione finisce,
         * parte la pausa di cinque minuti.
         */
        sessionForThisCycle.on(
          SessionEvent
            .SESSION_DISCONNECTED,
          () => {
            if (
              currentSession !==
                sessionForThisCycle ||
              pageIsClosing
            ) {
              return;
            }

            enterPause();
          }
        );

        /*
         * Avvia la sessione.
         */
        await sessionForThisCycle.start();

        if (
          currentSession !==
          sessionForThisCycle
        ) {
          return;
        }

        cycleState = "active";

        cycleOverlay.classList.add(
          "hidden"
        );

        beginActiveCountdown();

        /*
         * Se non è presente un saluto iniziale,
         * pronuncia automaticamente questa frase.
         */
        window.setTimeout(
          () => {
            if (
              currentSession ===
                sessionForThisCycle &&
              cycleState === "active" &&
              !avatarHasSpoken
            ) {
              sessionForThisCycle.repeat(
                INITIAL_GREETING
              );
            }
          },
          2200
        );

      } catch (error) {
        console.error(error);

        cycleState =
          "waiting-for-permission";

        if (
          error?.name ===
          "NotAllowedError"
        ) {
          showPermissionFallback(
            "Consenti l'uso del microfono una sola volta. Dopo l'autorizzazione, tutte le sessioni partiranno automaticamente.",
            "Consenti microfono"
          );
        } else {
          showPermissionFallback(
            error?.message ||
            "Non è stato possibile avviare la sessione.",
            "Riprova"
          );
        }
      }
    }

    /*
     * Pulsante visualizzato solo se il browser
     * richiede un'autorizzazione iniziale.
     */
    permissionButton.addEventListener(
      "click",
      async () => {
        permissionButton.disabled = true;

        try {
          if (!microphoneAuthorized) {
            await authorizeMicrophone();
          }

          /*
           * Sblocca l'audio nel browser.
           */
          await avatarVideo
            .play()
            .catch(() => {});

          hidePermissionFallback();

          /*
           * Se la sessione non è già attiva,
           * la avvia automaticamente.
           */
          if (
            cycleState !== "active"
          ) {
            cycleState = "ready";

            await startAutomaticSession();
          }

        } catch (error) {
          if (
            error?.name ===
            "NotAllowedError"
          ) {
            permissionMessage.textContent =
              "L'autorizzazione è stata rifiutata. Abilita il microfono nelle impostazioni del browser e riprova.";
          } else {
            permissionMessage.textContent =
              error?.message ||
              "Impossibile attivare l'esperienza.";
          }
        } finally {
          permissionButton.disabled = false;
        }
      }
    );

    /*
     * Chiude tutto quando si lascia la pagina.
     */
    window.addEventListener(
      "pagehide",
      () => {
        pageIsClosing = true;

        clearSessionTimers();
        clearPauseTimers();

        if (currentSession) {
          currentSession
            .stop()
            .catch(() => {});
        }
      }
    );

    /*
     * Primo avvio automatico.
     */
    window.addEventListener(
      "load",
      () => {
        window.setTimeout(
          startAutomaticSession,
          500
        );
      }
    );
  </script>
</body>
</html>
